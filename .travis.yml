language: android
dist: jammy
jdk: openjdk21

android:
  components:
    - tools
    - platform-tools
    - build-tools;35.0.0
    - platforms;android-30
  licenses:
    - android-sdk-license-.+
    - google-gdk-license-.+

before_install:
  - chmod +x gradlew

script:
  - ./gradlew --no-daemon clean build assembleRelease

before_cache:
  - rm -f $HOME/.gradle/caches/modules-2/modules-2.lock
  - rm -fr $HOME/.gradle/caches/*/plugin-resolution/

cache:
  directories:
    - $HOME/.gradle/caches/
    - $HOME/.gradle/wrapper/

deploy:
  provider: releases
  api_key:
    secure: 
  file: app/build/outputs/apk/release/app-release.apk
  skip_cleanup: true
  on:
    repo: eby8zevin/TravisCI-Android
    tags: true

notifications:
  email: false